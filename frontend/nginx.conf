server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad: nada de scripts o estilos de terceros, ni la página dentro de un iframe ajeno
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # API del backend (las investigaciones con el LLM pueden tardar minutos)
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 2m;   # lotes de hasta 200 alertas (POST /api/alertas)
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
